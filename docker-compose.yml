version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fdr_smarttrack_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fdr_smarttrack_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fdr_smarttrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fdr_smarttrack_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/fdr_smarttrack_db
      - SECRET_KEY=fdr_smarttrack_super_secret_jwt_key_2026_sih_hackathon_secure
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fdr_smarttrack_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
